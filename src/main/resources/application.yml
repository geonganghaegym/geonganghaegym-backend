spring:
  jackson:
    # Boot 4(Jackson 3) 기본값 대신 Boot 3(Jackson 2) 시절 기본값으로 API 직렬화 계약을 유지한다.
    use-jackson2-defaults: true
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}

    properties:
      mail:
        smtp:
          auth: true
          timeout: 5000
          starttls:
            enable: true

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}

    properties:
      hibernate:
        auto_quote_keyword: true
        globally_quoted_identifiers: true
        default_batch_fetch_size: 100
    open-in-view: false
  data:
    redis:
      host: ${DATA_REDIS_HOST}
      port: ${DATA_REDIS_PORT:6379}
      password: ${DATA_REDIS_PASSWORD:}
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

jwt:
  secret: ${JWT_SECRET_TOKEN}
  access-token-valid-seconds: ${JWT_ACCESS_TOKEN_VALID_SECONDS}
  refresh-token-valid-seconds: ${JWT_REFRESH_TOKEN_VALID_SECONDS}

server:
  port: 8080
  forward-headers-strategy: framework
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

  tomcat:
    uri-encoding: UTF-8

oauth:
  kakao:
    grant-type: ${OAUTH_KAKAO_GRANT_TYPE}
    client-id: ${OAUTH_KAKAO_CLIENT_ID}
    client-secret: ${OAUTH_KAKAO_CLIENT_SECRET}
    redirect-uri: ${OAUTH_KAKAO_REDIRECT_URI}
    token-uri: ${OAUTH_KAKAO_TOKEN_URI}
    user-info-uri: ${OAUTH_KAKAO_USER_INFO_URI}
    admin-key: ${OAUTH_KAKAO_ADMIN_KEY}
  naver:
    grant-type: ${OAUTH_NAVER_GRANT_TYPE}
    client-id: ${OAUTH_NAVER_CLIENT_ID}
    client-secret: ${OAUTH_NAVER_CLIENT_SECRET}
    token-uri: ${OAUTH_NAVER_TOKEN_URI}
    user-info-uri: ${OAUTH_NAVER_USER_INFO_URI}
  google:
    grant-type: ${OAUTH_GOOGLE_GRANT_TYPE}
    client-id: ${OAUTH_GOOGLE_CLIENT_ID}
    client-secret: ${OAUTH_GOOGLE_CLIENT_SECRET}
    token-uri: ${OAUTH_GOOGLE_TOKEN_URI}
    user-info-uri: ${OAUTH_GOOGLE_USER_INFO_URI}
    redirect-uri: ${OAUTH_GOOGLE_REDIRECT_URI}
  apple:
    team-id: ${OAUTH_APPLE_TEAM_ID}
    login-key: ${OAUTH_APPLE_LOGIN_KEY}
    client-id: ${OAUTH_APPLE_CLIENT_ID}
    key-path: ${OAUTH_APPLE_KEY_PATH}
    # Apple Developer에 등록된 Return URL과 문자열이 정확히 일치해야 한다.
    # 기본값은 운영 프론트엔드가 실제로 authorize에 사용하는 콜백 주소다.
    redirect-uri: ${OAUTH_APPLE_REDIRECT_URI:https://geonganghaejim.site/api/callback/apple}

file:
  upload-dir: ${FILE_UPLOAD_DIR:./build/local-files}
  base-url: ${FILE_BASE_URL:http://localhost:8080}

firebase:
  admin-sdk:
    file: ${FIREBASE_ADMIN_SDK_FILE}


# Spring openapi
springdoc:
  packages-to-scan: com.junghaebom.geonganghaegym
  default-consumes-media-type: application/json;charset=UTF-8
  default-produces-media-type: application/json;charset=UTF-8

  swagger-ui:
    disable-swagger-default-url: true
    display-request-duration: true
    tags-sorter: alpha
    operations-sorter: alpha

decorator:
  datasource:
    p6spy:
      enable-logging: false

management:
  info:
    java:
      enabled: true
    os:
      enabled: true
    env:
      enabled: true
  endpoint:
    health:
      show-components: always

  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  server:
    port: 7070

info:
  app:
    name: geonganghaegym-actuator
    company: geonganghaegym

---
spring:
  config:
    activate:
      on-profile: dev
  jpa:
    hibernate:
      ddl-auto: update

file:
  upload-dir: ${FILE_UPLOAD_DIR:./build/local-files}

decorator:
  datasource:
    p6spy:
      enable-logging: true
