apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app: backend
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      terminationGracePeriodSeconds: 40
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: backend
          image: ghcr.io/geonganghaegym/geonganghaegym-backend:placeholder
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 7070
              name: actuator
          resources:
            requests:
              cpu: "250m"
              memory: 768Mi
            limits:
              cpu: "1"
              memory: 2Gi
          startupProbe:
            httpGet:
              path: /actuator/health
              port: actuator
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: actuator
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: actuator
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 10"]
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-db-secret
            - secretRef:
                name: backend-redis-secret
            - secretRef:
                name: backend-jwt-secret
            - secretRef:
                name: backend-mail-secret
            - secretRef:
                name: backend-aws-secret
            - secretRef:
                name: backend-oauth-secret
          volumeMounts:
            - name: files
              mountPath: /data/files
            # Sign in with Apple 개인키(.p8). OAUTH_APPLE_KEY_PATH가 이 경로를 가리켜야 한다.
            - name: apple-key
              mountPath: /etc/apple
              readOnly: true
      volumes:
        - name: files
          persistentVolumeClaim:
            claimName: backend-files
        # 시크릿이 없어도 파드는 기동되고 애플 로그인만 실패하도록 optional 처리한다.
        - name: apple-key
          secret:
            secretName: backend-apple-key
            optional: true
